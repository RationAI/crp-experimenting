defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: prostate_cancer/train
  - /data/datasets@data.val: prostate_cancer/val
  - /data/datasets@data.test: prostate_cancer/test
  - /data/datasets@data.predict: prostate_cancer/predict
  - /model/backbone: ???
  - /model/optimizer: adamw
  - _self_

seed: ${random_seed:}
mode: ???
checkpoint: null

trainer:
  enable_checkpointing: True
  max_epochs: 3
  log_every_n_steps: 5
  # Val check interval tells how many times to check validation in an epoch
  val_check_interval: 0.25
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: validation/loss
      mode: min
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: validation/loss
      mode: min
      patience: 5
    - _target_: src.callbacks.MLFlowPredictionCallback

data:
  batch_size: 48
  num_workers: 8

metadata:
  experiment_name: Prostate
  run_name: "Develop: Prostate TL VGG16"
  description: "Development and reproduction of Tile Level (TL) VGG16"
  hyperparams:
    max_epochs: ${trainer.max_epochs}
    lr: ${model.optimizer.lr}
    batch_size: ${data.batch_size}
    val_check_interval: ${trainer.val_check_interval}